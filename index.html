<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Door – prison ministry hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C1017;--panel:#141A24;--raised:#1B2230;--line:#262F3F;--line2:#323C4E;
  --text:#E9EDF3;--muted:#8D97A9;--faint:#5E6779;
  --gold:#F0B94A;--gold-dim:#3A2F1A;--violet:#8794FF;--cyan:#5FC8E4;--green:#3DD68C;--green-dim:#163326;--red:#FF5C64;--red-dim:#3A1A1E;--pink:#F38BA5;
  --head:"Sora","Segoe UI",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--head);margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.2}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}
.muted{color:var(--muted)}
.num{font-family:var(--head);font-variant-numeric:tabular-nums}

/* ---------- Login ---------- */
#login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
@media(max-width:900px){#login{grid-template-columns:1fr}.door-side{min-height:520px;padding:2rem 1.5rem}}
.door-side{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:3rem;background:radial-gradient(120% 90% at 50% 100%,#1A1408 0%,var(--bg) 60%)}
.door{position:absolute;left:50%;top:6%;transform:translateX(-50%);width:min(240px,40vw);aspect-ratio:3/4.6}
.door svg{width:100%;height:100%;overflow:visible}
.door .glow{transform-origin:50% 100%;animation:open 2.4s cubic-bezier(.16,1,.3,1) .2s both}
.door .beam{opacity:.0;animation:beam 2.6s ease .9s both}
@keyframes open{from{transform:scaleX(.02);opacity:.2}to{transform:scaleX(1);opacity:1}}
@keyframes beam{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.door .glow,.door .beam{animation:none;opacity:1}}
.door-copy{position:relative;z-index:1;max-width:560px}
.door-copy h1{font-size:clamp(2rem,3.2vw,3rem);line-height:1.08;letter-spacing:-.03em;text-wrap:balance}
.door-copy p{color:var(--muted);margin-top:.75rem;font-size:1.05rem}
.login-side{display:flex;align-items:center;justify-content:center;padding:2.5rem 1.5rem;background:var(--panel);border-left:1px solid var(--line)}
.login-box{width:100%;max-width:420px}
.wordmark{display:flex;align-items:center;gap:.6rem;font-family:var(--head);font-weight:700;font-size:1.25rem;margin-bottom:2.2rem}
.login-box h2{font-size:1.6rem}
.login-box>p{color:var(--muted);margin:.35rem 0 1.6rem}
.roles{display:grid;gap:.6rem;margin-bottom:1.4rem}
.roleopt{position:relative}
.roleopt input{position:absolute;opacity:0}
.roleopt label{display:flex;gap:.85rem;align-items:center;padding:.85rem 1rem;border:1px solid var(--line2);border-radius:12px;cursor:pointer;background:var(--raised);transition:border-color .15s,background .15s}
.roleopt input:checked+label{border-color:var(--gold);background:var(--gold-dim)}
.roleopt input:focus-visible+label{outline:2px solid var(--gold);outline-offset:2px}
.roleopt .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--bg);flex:none;color:var(--gold)}
.roleopt b{display:block;font-weight:600}
.roleopt small{color:var(--muted)}
.field{margin-bottom:.9rem}
.field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.35rem;font-weight:500}
.input,select.input,textarea.input{width:100%;padding:.7rem .85rem;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--text)}
textarea.input{min-height:90px;resize:vertical}
.demo-note{font-size:.82rem;color:var(--faint);margin-top:1rem;text-align:center}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid var(--gold);background:var(--gold);color:#1A1306;padding:.62rem 1.1rem;border-radius:10px;font-weight:600;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.full{width:100%;padding:.85rem}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.sm{padding:.38rem .7rem;font-size:.85rem;border-radius:8px}
.btn.danger{background:transparent;border-color:var(--red-dim);color:var(--red)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ---------- Shell ---------- */
#shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:1.4rem 1rem;border-right:1px solid var(--line);background:var(--panel)}
.side .wordmark{margin:0 .5rem 2rem;font-size:1.1rem}
.nav{display:flex;flex-direction:column;gap:.2rem}
.nav button{display:flex;align-items:center;gap:.75rem;padding:.65rem .75rem;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{color:var(--text);background:var(--raised)}
.nav button[aria-current="page"]{color:var(--text);background:var(--raised);box-shadow:inset 3px 0 0 var(--gold)}
.nav .badge{margin-left:auto;background:var(--violet);color:#0C1017;font-size:.72rem;font-weight:700;border-radius:99px;padding:.05rem .45rem}
.me{margin-top:auto;display:flex;align-items:center;gap:.65rem;padding:.75rem;border-radius:12px;background:var(--raised)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none;color:#0C1017}
.me{flex-wrap:wrap}.me div{min-width:0;flex:1}.meic{display:flex;gap:.2rem;width:100%;justify-content:flex-end;border-top:1px solid var(--line);padding-top:.4rem;margin-top:.1rem}
.me b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:var(--muted);font-size:.78rem}
.iconbtn{border:0;background:none;color:var(--muted);cursor:pointer;padding:.35rem;border-radius:8px;display:grid;place-items:center}
.iconbtn:hover{color:var(--text);background:var(--line)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:1rem;padding:1rem 2rem;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:1.25rem;margin-right:auto}
.scope{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.88rem}
.scope select{max-width:62vw;padding:.5rem .7rem;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--text)}
#view{padding:1.75rem 2rem 4rem;max-width:1280px}
@media(max-width:860px){
  #shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:.6rem;gap:.5rem;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .side .wordmark{display:none}.nav{flex-direction:row}.nav button span.lbl{display:none}.me{margin:0 0 0 auto;padding:.35rem .5rem}.me div{display:none}
  .top{padding:.8rem 1rem;flex-wrap:wrap}#view{padding:1.25rem 1rem 4rem}
}

/* ---------- Panels & grids ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.35rem}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.ph h3{font-size:1.02rem}
.ph small{color:var(--muted)}
.grid{display:grid;gap:1.1rem}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.kpi .big{font-size:1.8rem}.kpi svg.spark{display:none}}
.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media(max-width:1000px){.two{grid-template-columns:1fr}}
.kpi{position:relative;overflow:hidden}
.kpi .lab{color:var(--muted);font-size:.86rem}
.kpi .big{font-size:2.3rem;font-weight:700;line-height:1.1;margin:.3rem 0 .15rem}
.kpi .sub{font-size:.82rem;color:var(--muted)}
.kpi svg.spark{position:absolute;right:1.1rem;top:1.1rem;width:84px;height:32px}
.mt{margin-top:1.1rem}
.welcome{margin-bottom:1.4rem}
.welcome h2{font-size:1.65rem;letter-spacing:-.02em}
.welcome p{color:var(--muted);margin-top:.2rem}

/* journey funnel */
.journey{display:flex;flex-direction:column;gap:.55rem}
.jrow{display:grid;grid-template-columns:150px 1fr 38px;align-items:center;gap:.8rem;background:none;border:0;padding:.15rem 0;cursor:pointer;text-align:left;color:inherit}
.jrow .bar{height:30px;border-radius:8px;background:var(--raised);position:relative;overflow:hidden}
.jrow .fill{position:absolute;inset:0 auto 0 0;border-radius:8px;transition:width .5s cubic-bezier(.16,1,.3,1)}
.jrow .n{font-family:var(--head);font-weight:700;text-align:right}
.jrow:hover .bar{outline:1px solid var(--line2)}
@media(max-width:520px){.jrow{grid-template-columns:110px 1fr 30px}.jrow span.l{font-size:.85rem}}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap}
.donut{position:relative;width:180px;height:180px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .center b{font-family:var(--head);font-size:2rem;line-height:1}
.donut .center small{color:var(--muted);font-size:.8rem}
.legend{display:flex;flex-direction:column;gap:.55rem;flex:1;min-width:160px}
.legend div{display:flex;align-items:center;gap:.55rem;font-size:.9rem}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{margin-left:auto;font-family:var(--head);font-weight:600}

/* list rows */
.vlist{display:flex;flex-direction:column}
.vrow{display:flex;gap:.9rem;padding:.8rem 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0;padding-top:0}
.vdate{width:48px;flex:none;text-align:center;background:var(--raised);border-radius:10px;padding:.35rem 0;line-height:1.1}
.vdate b{display:block;font-family:var(--head);font-size:1.15rem}
.vdate small{color:var(--muted);font-size:.72rem}
.pill{display:inline-flex;align-items:center;gap:.35rem;font-size:.76rem;font-weight:600;padding:.18rem .55rem;border-radius:99px;background:var(--raised);color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%}

/* tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.8rem;padding:.6rem .75rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.8rem .75rem;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--raised)}
td.amt{font-family:var(--head);font-variant-numeric:tabular-nums;white-space:nowrap}
.owing{color:var(--red);font-weight:700}
.done{color:var(--green);font-weight:700}
.status{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:700;padding:.22rem .6rem;border-radius:99px;white-space:nowrap}
.status.red{background:var(--red-dim);color:var(--red)}
.status.green{background:var(--green-dim);color:var(--green)}
.status.amber{background:var(--gold-dim);color:var(--gold)}

/* category cards */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem;margin-bottom:1.1rem}
@media(max-width:1100px){.cats{grid-template-columns:repeat(2,1fr)}}
.cat{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:1rem;cursor:pointer;color:inherit}
.cat[aria-pressed="true"]{border-color:var(--c)}
.cat .t{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.92rem}
.cat .t i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.cat .o{font-family:var(--head);font-size:1.6rem;font-weight:700;margin:.45rem 0 .1rem}
.cat small{color:var(--muted);font-size:.8rem}
.meter{height:6px;border-radius:99px;background:var(--raised);overflow:hidden;margin-top:.6rem}
.meter b{display:block;height:100%;background:var(--c);border-radius:99px}
.seg{display:inline-flex;background:var(--raised);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);padding:.4rem .8rem;border-radius:8px;cursor:pointer;font-weight:500;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 0 var(--line2)}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:.6rem;margin-bottom:1.1rem}
@media(max-width:1000px){.pipe{grid-template-columns:repeat(3,1fr)}}
.stage{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:.9rem 1rem;cursor:pointer;color:inherit;overflow:hidden}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c);opacity:.7}
.stage[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.stage b{display:block;font-family:var(--head);font-size:1.9rem;line-height:1.1}
.stage small{color:var(--muted);font-size:.8rem;display:block;margin-top:.2rem}
.stage .step{font-size:.72rem;color:var(--faint)}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(5,8,12,.6);z-index:40;display:none}
.scrim.open{display:block}
.drawer{visibility:hidden;position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);overflow-y:auto;padding:calc(1.5rem + env(safe-area-inset-top,0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom,0px))}
.drawer.open{transform:none;visibility:visible}
.modal{position:fixed;inset:0;z-index:42;display:none;place-items:center;padding:1rem}
.modal.open{display:grid}
.mbox{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:1.5rem;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.mbox h3{font-size:1.2rem;margin-bottom:1rem}
.actions{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1.2rem}
@media (prefers-reduced-motion:reduce){.drawer,.jrow .fill{transition:none}}
.tl{list-style:none;margin:1rem 0 0;padding:0}
.tl li{position:relative;padding:0 0 1rem 1.2rem;border-left:1px solid var(--line2);font-size:.9rem}
.tl li::before{content:"";position:absolute;left:-5px;top:.35rem;width:9px;height:9px;border-radius:50%;background:var(--c,var(--violet))}
.tl small{color:var(--muted);display:block}

/* wizard */
.steps{display:flex;gap:.5rem;margin-bottom:1.4rem;flex-wrap:wrap}
.steps div{display:flex;align-items:center;gap:.5rem;color:var(--faint);font-size:.9rem;font-weight:500}
.steps div b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font-size:.8rem}
.steps div.on{color:var(--text)}.steps div.on b{background:var(--gold);color:#1A1306;border-color:var(--gold)}
.steps div.ok b{background:var(--green-dim);color:var(--green);border-color:var(--green-dim)}
.steps hr{flex:0 0 28px;border:0;border-top:1px solid var(--line2);margin:0}
.wiz{max-width:860px}
.choice{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.6rem}
.tile{text-align:left;border:1px solid var(--line2);background:var(--raised);border-radius:12px;padding:.85rem 1rem;cursor:pointer;color:inherit}
.tile[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-dim)}
.tile b{display:block;font-weight:600}
.tile small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0}
.chip span{display:inline-block;padding:.38rem .8rem;border:1px solid var(--line2);border-radius:99px;font-size:.86rem;cursor:pointer;background:var(--raised)}
.chip input:checked+span{background:var(--c,var(--gold));border-color:var(--c,var(--gold));color:#0C1017;font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.lbl2{font-size:.85rem;color:var(--muted);font-weight:500;margin:1.2rem 0 .5rem;display:block}
.prow{border:1px solid var(--line2);border-radius:14px;padding:1.1rem;margin-bottom:.9rem;background:var(--bg)}
.prow .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:640px){.row2{grid-template-columns:1fr}}
.needgroup{margin-top:.6rem}
.needgroup small{display:block;color:var(--muted);font-size:.78rem;margin-bottom:.3rem}
.navrow{display:flex;justify-content:space-between;margin-top:1.4rem}
.review dl{display:grid;grid-template-columns:150px 1fr;gap:.55rem 1rem;margin:0}
.review dt{color:var(--muted)}.review dd{margin:0}

/* letters */
.lgrid{display:grid;grid-template-columns:400px 1fr;gap:1.1rem;align-items:start}
@media(max-width:1050px){.lgrid{grid-template-columns:1fr}}
.ring{position:relative;width:300px;height:300px;margin:.5rem auto 1.2rem}
.ring svg{width:100%;height:100%}
.ring path{cursor:pointer;transition:stroke-width .2s,opacity .2s}
.ring path:hover,.ring path.sel{stroke-width:40}
.ring path.dim{opacity:.35}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.ring .center b{font-family:var(--head);font-size:2.6rem;line-height:1}
.ring .center small{color:var(--muted)}
.stagelist{display:flex;flex-direction:column;gap:.35rem}
.stagelist button{display:flex;align-items:center;gap:.65rem;padding:.6rem .75rem;border-radius:10px;border:1px solid transparent;background:none;color:inherit;cursor:pointer;text-align:left}
.stagelist button[aria-pressed="true"]{border-color:var(--line2);background:var(--raised)}
.stagelist i{width:10px;height:10px;border-radius:50%;flex:none}
.stagelist span{margin-left:auto;font-family:var(--head);font-weight:700}
.stagelist small{color:var(--muted);font-size:.78rem}
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-bottom:1.1rem}
@media(max-width:640px){.team{grid-template-columns:repeat(2,1fr)}}
.tm{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.35rem;padding:.9rem .5rem;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.tm .av{width:44px;height:44px;font-size:.95rem}
.tm b{font-size:.88rem}
.tm small{color:var(--muted);font-size:.76rem}
.lcard{border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;background:var(--bg);margin-bottom:.7rem}
.lcard .top2{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;align-items:center}
.lcard p.body{margin-top:.6rem;color:var(--muted);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lcard .approval{margin-top:.7rem;padding:.65rem .8rem;border-radius:10px;background:var(--raised);font-size:.86rem}
.lcard .approval b{color:var(--cyan)}
.ticks{display:flex;gap:1rem;align-items:center;margin-top:.7rem;flex-wrap:wrap}
.tick{display:flex;align-items:center;gap:.45rem;font-size:.9rem;cursor:pointer}
.tick input{width:18px;height:18px;accent-color:var(--gold)}
.counts{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.counts div{flex:1;min-width:110px;padding:.8rem 1rem;border-radius:12px;background:var(--raised)}
.counts b{display:block;font-family:var(--head);font-size:1.5rem}
.counts small{color:var(--muted);font-size:.8rem}
.empty{padding:2rem;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:14px}
.lock{font-size:.82rem;color:var(--faint);margin-top:.5rem}

/* follow-ups */

/* ======= Impact ======= */
function impact(){
  const res=S.res.filter(inFac),needs=S.needs.filter(inFac),lets=S.letters.filter(lFac);
  const met=needs.filter(n=>!owing(n));const pct=needs.length?Math.round(met.length/needs.length*100):0;
  const days=met.map(n=>Math.max(1,Math.round((new Date((n.upd||n.d)+'T12:00')-new Date(n.d+'T12:00'))/864e5))).sort((a,b)=>a-b);const med=days.length?days[Math.floor(days.length/2)]:0;
  const seen30=res.filter(r=>ageOf(r.last)<=30).length;const seenPct=res.length?Math.round(seen30/res.length*100):0;
  const moved=res.filter(r=>(r.hist||[]).some(h=>h.stage>0&&ageOf(h.d)<=90)).length;
  const sent=lets.filter(l=>l.stage>=4).length,reps=lets.filter(l=>l.replies.length).length;
  const quotes=lets.flatMap(l=>l.replies.filter(p=>p.ok).map(p=>({p,l}))).slice(0,3);
  const card=(q,big,sub,how,c)=>`<div class="panel imp"><div class="q">${q}</div><div class="big" style="color:${c}">${big}</div><div class="muted" style="font-size:.88rem">${sub}</div><div class="how">${how}</div></div>`;
  return `<p class="rolenote">Impact is not how busy we were. It is whether the promises made inside were kept, and whether people are growing. These four questions are for the church board.</p>
  <div class="imp-hero">
    ${card('Did we keep our promises?',pct+'%',`${met.length} of ${needs.length} needs met`,`Typical wait: ${med} day${med===1?'':'s'} from asked to delivered`,'var(--green)')}
    ${card('Did anyone get forgotten?',seenPct+'%',`seen in the last 30 days`,`${res.length-seen30} people not seen in over a month`,seenPct>=70?'var(--green)':'var(--gold)')}
    ${card('Are people growing?',moved,`moved forward a stage in 90 days`,`${res.filter(r=>r.stage===5).length} baptized so far`,'var(--violet)')}
    ${card('Are letters getting through?',sent,`letters sent`,`${reps} answered by the person inside`,'var(--cyan)')}
  </div>
  <div class="grid two mt">
    <div class="panel"><div class="ph"><h3>Weekly attendance</h3><small>Last 12 weeks</small></div>${areaChart(weekly())}</div>
    <div class="panel"><div class="ph"><h3>In their own words</h3><small>Replies, shared with permission</small></div>${quotes.map(({p,l})=>`<div class="quote"><p>“${esc(p.body)}”</p><small>${esc(R(l.res).name)} · to ${esc(l.writer)} · ${fmt(p.d)}</small></div>`).join('')||'<p class="muted">No replies shared yet.</p>'}</div>
  </div>
  <div class="panel mt"><div class="ph"><h3>Where people are on the journey</h3><small>Tap a stage</small></div><div class="journey">${(()=>{const cnt=STAGES.map((_,i)=>res.filter(r=>r.stage===i).length),mx=Math.max(...cnt,1);return STAGES.map((st,i)=>`<button class="jrow" data-act="gostage" data-i="${i}"><span class="l">${st}</span><span class="bar"><span class="fill" style="width:${cnt[i]/mx*100}%;background:${SCOL[i]}"></span></span><span class="n">${cnt[i]}</span></button>`).join('')})()}</div></div>
  <div class="actions" style="justify-content:flex-start"><button class="btn ghost" data-act="sharereport">Share this report with the church board</button></div>`;
}

/* ======= Dashboard ======= */

    <div class="panel kpi"><div class="lab">Needs met</div><div class="big num">${pct}%</div><div class="sub">${askedN-metN} still owing</div>${spark([.45,.55,.6,.7,.75,.82,.9,1].map(f=>Math.round(pct*f)),'#3DD68C')}</div>
    <div class="panel kpi"><div class="lab">Letters in motion</div><div class="big num">${lets.filter(l=>l.stage<4).length}</div><div class="sub">${lets.filter(l=>l.stage>=4).length} sent · ${lets.reduce((n,l)=>n+l.replies.length,0)} replies</div>${spark([2,3,3,5,4,6,7,8],'#5FC8E4')}</div>
  </div>

      <div class="journey">${STAGES.map((s,i)=>`<button class="jrow" data-act="gostage" data-i="${i}"><span class="l">${s}</span><span class="bar"><span class="fill" style="width:${counts[i]/maxc*100}%;background:${SCOL[i]}"></span></span><span class="n">${counts[i]}</span></button>`).join('')}</div>
    </div>

      <div class="legend">${byCat.map(b=>`<div><i style="background:${b.c.c}"></i>${b.c.label}<span style="color:${b.open?'var(--red)':'var(--green)'}">${b.open?b.open+' owing':'✓'}</span></div>`).join('')}</div></div>
    </div>
  </div>

    <div class="panel"><div class="ph"><h3>Weekly attendance</h3><small>Last 12 weeks</small></div>${areaChart(w)}</div>

      <div class="vlist">${recent.length?recent.map(v=>{const d=new Date(v.d+'T12:00');return `<div class="vrow"><div class="vdate"><b>${d.getDate()}</b><small>${d.toLocaleDateString(undefined,{month:'short'})}</small></div><div><b>${esc(F(v.fac).short)}</b> <span class="muted">· ${v.attend} attended</span><div class="muted" style="font-size:.86rem;margin-top:.15rem">${v.vols.map(x=>esc(V(x).name)).join(', ')} · ${v.acts.join(', ')}</div></div></div>`}).join(''):'<p class="muted">No visits logged yet.</p>'}</div>
    </div>
  </div>`;
}

/* ======= Log a visit (wizard) ======= */
const newRow=()=>({who:'',name:'',stage:0,needs:[],amount:'',note:'',follow:U.role==='vol'?'v1':'v1'});
function freshDraft(){return{step:1,d:today(),state:U.fac?F(U.fac).state:'Virginia',fac:U.fac||'',attend:'',vols:U.role==='vol'?['v1']:[],acts:[],rows:[newRow()],summary:''}}

  if(D.step===2)body=`<div class="panel">
    <span class="lbl2" style="margin-top:0">Who went</span><div class="choice">${VOLS.map(v=>`<button class="tile" data-act="wvol" data-id="${v.id}" aria-pressed="${D.vols.includes(v.id)}" style="display:flex;gap:.7rem;align-items:center">${av(v.name,v.c)}<b>${esc(v.name)}</b></button>`).join('')}</div>
    <span class="lbl2">What happened</span><div class="chips">${ACTS.map(a=>`<label class="chip"><input type="checkbox" data-act-chk="wact" value="${a}" ${D.acts.includes(a)?'checked':''}><span>${a}</span></label>`).join('')}</div>
    <span class="lbl2">Notes for the church</span><textarea class="input" data-bind="summary" placeholder="Chaplain requests, changes to visiting rules, prayer points">${esc(D.summary)}</textarea></div>`;
  if(D.step===3){const known=S.res.filter(r=>r.fac===D.fac);
    body=D.rows.map((p,i)=>`<div class="prow"><div class="head"><b>Person ${i+1}</b>${D.rows.length>1?`<button class="btn sm danger" data-act="wrm" data-i="${i}">Remove</button>`:''}</div>
      <div class="row2"><div class="field"><label>Who</label><select class="input" data-row="${i}" data-f="who"><option value="">Someone new</option>${known.map(r=>`<option value="${r.id}" ${p.who===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div>
      ${p.who?`<div class="field"><label>Follow-up volunteer</label><select class="input" data-row="${i}" data-f="follow">${VOLS.map(v=>`<option value="${v.id}" ${p.follow===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div>`:`<div class="field"><label>Name</label><input class="input" data-row="${i}" data-f="name" value="${esc(p.name)}" placeholder="First name and last initial"></div>`}</div>
      <div class="field"><label>Where they are</label><select class="input" data-row="${i}" data-f="stage">${STAGES.map((s,j)=>`<option value="${j}" ${+p.stage===j?'selected':''}>${s}</option>`).join('')}</select></div>
      <span class="lbl2">Needs</span>${Object.entries(CATS).map(([k,c])=>`<div class="needgroup"><small>${c.label}</small><div class="chips">${c.items.map(it=>`<label class="chip" style="--c:${c.c}"><input type="checkbox" data-row="${i}" data-need="${k}|${it}" ${p.needs.includes(k+'|'+it)?'checked':''}><span>${it}</span></label>`).join('')}</div></div>`).join('')}
      ${p.needs.includes('supplies|Clothes')?`<div class="field" style="margin-top:.8rem;max-width:240px"><label>Clothes size</label><input class="input" data-row="${i}" data-f="size" value="${esc(p.size||'')}" placeholder="e.g. L, 34x32, shoes 10"></div>`:''}${p.needs.some(n=>n.startsWith('financial|'))?`<div class="field" style="margin-top:.8rem;max-width:240px"><label>Amount asked ($)</label><input class="input" type="number" min="0" data-row="${i}" data-f="amount" value="${esc(p.amount)}" placeholder="e.g. 25"></div>`:''}

      <dt>People</dt><dd>${ppl.map(p=>`${esc(p.who?R(p.who).name:p.name)} <span class="pill"><i style="background:${SCOL[p.stage]}"></i>${STAGES[p.stage]}</span>`).join('<br>')||'–'}</dd>
      <dt>New needs</dt><dd>${nn?nn+' added to the needs board':'None'}</dd></dl></div>`}

function submitVisit(){
  const D=U.draft;const seen=[];let nn=0;
  D.rows.forEach(p=>{if(!p.who&&!p.name.trim())return;let r=S.res.find(x=>x.id===p.who);
    if(!r){r={id:uid('r'),name:p.name.trim(),fac:D.fac,stage:+p.stage,topic:'',follow:p.follow,last:D.d,notes:[],joined:D.d,hist:[{d:D.d,stage:+p.stage}],events:[],flag:false};S.res.push(r)}
    else if(+p.stage!==r.stage){(r.hist=r.hist||[]).push({d:D.d,stage:+p.stage})}
    r.flag=false;if(p.evtype&&p.evdate)(r.events=r.events||[]).push({id:uid('e'),type:p.evtype,d:p.evdate,note:'',by:ME[U.role].name});
    r.stage=+p.stage;r.last=D.d;r.follow=p.follow;if(p.note.trim())r.notes.unshift({d:D.d,by:ME[U.role].name,t:p.note.trim()});seen.push(r.id);
    p.needs.forEach(key=>{const[cat,item]=key.split('|');if(item==='Wants a letter'){S.letters.push({id:uid('l'),res:r.id,about:p.note.trim().slice(0,80)||'Asked for someone to write to him',from:ME[U.role].vid||'v1',writer:null,body:'',stage:0,reviewer:null,approval:null,carrier:null,sentD:null,returned:null,d:D.d,replies:[]});nn++;return}const money=cat==='financial';S.needs.push({id:uid('n'),res:r.id,fac:D.fac,cat,item,detail:item==='Clothes'&&p.size?'Size '+p.size:(p.note.trim().slice(0,80)||'Details to follow'),asked:money?(+p.amount||20):1,money,supplied:0,ordered:false,from:ME[U.role].vid||'v1',d:D.d,upd:D.d,by:null});nn++})});
  S.visits.push({id:uid('x'),d:D.d,fac:D.fac,vols:D.vols,acts:D.acts,attend:+D.attend||0,seen,summary:D.summary});
  U.draft=null;U.tab=U.role==='vol'?'home':'follow';render();toast(`Report submitted · ${seen.length} people · ${nn} needs`);
}

/* ======= Follow-ups: no one left behind ======= */
function F4(){
  const needsW=S.needs.filter(inFac).filter(n=>owing(n)).sort((a,b)=>a.d.localeCompare(b.d));
  const letW=S.letters.filter(lFac).filter(l=>l.stage<=2).sort((a,b)=>a.d.localeCompare(b.d));
  const missed=[];FACS.filter(f=>!U.fac||f.id===U.fac).forEach(f=>{const lv=S.visits.filter(v=>v.fac===f.id).sort((a,b)=>b.d.localeCompare(a.d))[0];if(!lv)return;
    S.res.filter(r=>r.fac===f.id&&!lv.seen.includes(r.id)).forEach(r=>missed.push({r,v:lv}))});
  missed.sort((a,b)=>a.r.last.localeCompare(b.r.last));
  const ev=[];S.res.filter(inFac).forEach(r=>(r.events||[]).forEach(e=>{const u=untilOf(e.d);if(u>=0&&u<=60)ev.push({r,e,u})}));ev.sort((a,b)=>a.u-b.u);
  return{needsW,letW,missed,ev};
}
const urgent=()=>{const x=F4();return x.needsW.filter(n=>ageOf(n.d)>=14).length+x.letW.filter(l=>ageOf(l.d)>=5).length+x.ev.filter(e=>e.u<=7).length};
const ageBadge=(n,warn,bad,lab='days')=>`<div class="age ${n>=bad?'red':n>=warn?'amber':''}"><b>${n}</b><small>${n===1?lab.replace(/s$/,''):lab}</small></div>`;
const soonBadge=u=>`<div class="age ${u<=7?'red':u<=21?'amber':'green'}"><b>${u===0?'Today':u}</b><small>${u===0?'':u===1?'day':'days'}</small></div>`;
function follow(){
  const x=F4();const lim=(k,a)=>U.fx[k]?a:a.slice(0,5);
  const more=(k,a)=>a.length>5?`<button class="more" data-act="fxmore" data-k="${k}">${U.fx[k]?'Show fewer':'Show all '+a.length}</button>`:'';
  const empty=t=>`<div class="empty">${t}</div>`;
  const rev=U.role==='review';
  return `<p class="intro">The goal is that no one is left behind. These four lists show what has waited longest, so the team can act today.</p>
  ${attStrip(x)}
  <div class="fgrid">
  <div class="panel" id="fx-needs"><div class="ph"><h3>Needs waiting longest</h3><small>${x.needsW.length} not yet met</small></div>
    ${x.needsW.length?lim('n',x.needsW).map(n=>`<div class="frow">${ageBadge(ageOf(n.d),7,14)}<div class="mid"><b>${esc(n.item)} · ${amt(n,owing(n))} owing</b><small>${esc(R(n.res).name)} · ${esc(F(n.fac).short)} · asked ${fmt(n.d)}</small></div><div class="act"><button class="btn sm ghost" data-act="supply" data-id="${n.id}">Record supply</button></div></div>`).join('')+more('n',x.needsW):empty('Every need has been met.')}</div>
  <div class="panel" id="fx-letters"><div class="ph"><h3>Letters not yet sent</h3><small>${x.letW.length} waiting</small></div>

  <div class="panel" id="fx-events"><div class="ph"><h3>Coming up</h3><small>Next 60 days</small></div>
    ${x.ev.length?lim('e',x.ev).map(({r,e,u})=>`<div class="frow">${soonBadge(u)}<div class="mid"><b><span style="color:${ETYPES[e.type]||ETYPES.Other}">${esc(e.type)}</span> · ${esc(r.name)}</b><small>${fmt(e.d)} · ${esc(F(r.fac).short)}${e.note?' · '+esc(e.note):''}</small></div><div class="act"><button class="btn sm ghost" data-act="writeto" data-id="${r.id}">Write</button><button class="btn sm ghost" data-act="person" data-id="${r.id}">Profile</button></div></div>`).join('')+more('e',x.ev):empty('No dates coming up. Add court, release or parole dates from a person’s profile.')}</div>
  </div>

}
function attStrip(x){

/* ======= Needs ======= */
function needs(){
  const all=S.needs.filter(inFac);
  const sum=list=>{const money=list.filter(n=>n.money),items=list.filter(n=>!n.money);return{req:list.length,met:list.filter(n=>!owing(n)).length,
    ma:money.reduce((s,n)=>s+n.asked,0),ms:money.reduce((s,n)=>s+n.supplied,0),ia:items.reduce((s,n)=>s+n.asked,0),is:items.reduce((s,n)=>s+n.supplied,0)}};
  const cell=(a,sup)=>{const parts=[];if(a.ma)parts.push('$'+a.ma);if(a.ia)parts.push(a.ia+(a.ia===1?' item':' items'));return parts.join(' + ')||'–'};
  const fmtS=x=>{const p=[];if(x.ma)p.push('$'+x.ms);if(x.ia)p.push(x.is+(x.is===1?' item':' items'));return p.join(' + ')||'–'};
  const fmtO=x=>{const p=[];if(x.ma-x.ms)p.push('$'+(x.ma-x.ms));if(x.ia-x.is)p.push((x.ia-x.is)+((x.ia-x.is)===1?' item':' items'));return p.join(' + ')};
  const rows=Object.entries(CATS).map(([k,c])=>{const x=sum(all.filter(n=>n.cat===k));const o=fmtO(x);const pct=x.req?Math.round(x.met/x.req*100):0;
    return `<tr class="click" data-act="ncat" data-k="${k}" tabindex="0" ${U.ncat===k?'style="background:var(--raised)"':''}><td><span style="display:inline-flex;align-items:center;gap:.55rem;font-weight:600"><i style="width:10px;height:10px;border-radius:50%;background:${c.c}"></i>${c.label}</span></td>
    <td class="amt">${cell(x)}</td><td class="amt done">${fmtS(x)}</td><td class="amt ${o?'owing':'done'}">${o||'All supplied'}</td>
    <td style="min-width:140px"><div style="display:flex;align-items:center;gap:.6rem"><div class="meter" style="flex:1;margin:0;--c:${pct===100?'var(--green)':c.c}"><b style="width:${pct}%"></b></div><span class="muted" style="font-size:.82rem;width:34px">${pct}%</span></div></td></tr>`}).join('');
  const T0=sum(all);const tO=fmtO(T0);
  let list=all.filter(n=>!U.ncat||n.cat===U.ncat);
  if(U.nfilter==='owing')list=list.filter(n=>owing(n));if(U.nfilter==='done')list=list.filter(n=>!owing(n));
  list.sort((a,b)=>(owing(b)?1:0)-(owing(a)?1:0)||b.d.localeCompare(a.d));
  return `<div class="panel"><div class="ph"><h3>Asked, supplied and still owing</h3><small>Tap a category to see its requests</small></div>
  <div class="tablewrap"><table><thead><tr><th>Category</th><th>Asked for</th><th>Supplied</th><th>Still owing</th><th>Met</th></tr></thead><tbody>${rows}
  <tr><td><b>Total</b></td><td class="amt"><b>${cell(T0)}</b></td><td class="amt done">${fmtS(T0)}</td><td class="amt ${tO?'owing':'done'}">${tO||'All supplied'}</td><td class="muted" style="font-size:.82rem">${T0.req?Math.round(T0.met/T0.req*100):0}% of ${T0.req} requests</td></tr></tbody></table></div></div>
  <div class="panel mt"><div class="ph" style="flex-wrap:wrap"><h3 style="display:flex;align-items:center;gap:.6rem">${U.ncat?`<i style="width:10px;height:10px;border-radius:50%;background:${CATS[U.ncat].c};display:inline-block"></i>${CATS[U.ncat].label} requests <button class="btn sm ghost" data-act="ncat" data-k="${U.ncat}">Show all</button>`:'Requests'}</h3>
    <div class="seg">${[['owing','Still owing'],['done','Supplied'],['all','All']].map(([k,l])=>`<button data-act="nfilter" data-k="${k}" aria-pressed="${U.nfilter===k}">${l}</button>`).join('')}</div></div>
  <div class="tablewrap"><table><thead><tr><th>Need</th><th>For</th><th>Asked</th><th>Supplied</th><th>Owing</th><th></th></tr></thead><tbody>
  ${list.length?list.map(n=>{const o=owing(n);return `<tr><td><b>${esc(n.item)}</b><div class="muted" style="font-size:.82rem">${esc(n.detail)}</div></td>
    <td>${esc(R(n.res).name)}<div class="muted" style="font-size:.82rem">${esc(F(n.fac).short)} · ${fmt(n.d)}</div></td>
    <td class="amt">${amt(n,n.asked)}</td><td class="amt ${n.supplied?'done':'muted'}">${amt(n,n.supplied)}</td><td class="amt ${o?'owing':'done'}">${o?amt(n,o):'✓'}</td>
    <td style="text-align:right;white-space:nowrap">${nchip(n)} ${U.role!=='coord'||!o?'':n.money?`<button class="btn sm ghost" data-act="supply" data-id="${n.id}">Record gift</button>`:n.ordered?`<button class="btn sm" data-act="ndeliver" data-id="${n.id}">${phys(n)?'Mark delivered':'Mark done'}</button>`:`<button class="btn sm ghost" data-act="norder" data-id="${n.id}">${phys(n)?'Order':'Start'}</button>`}</td></tr>`}).join(''):`<tr><td colspan="6"><div class="empty">${U.nfilter==='owing'?'Nothing owing here. Every request has been supplied.':'Nothing here yet.'}</div></td></tr>`}
  </tbody></table></div></div>`;
}

/* ======= People ======= */
function people(){
  const base=S.res.filter(inFac).filter(r=>!U.pmine||r.follow===(ME[U.role].vid||'v1'));
  const counts=STAGES.map((_,i)=>base.filter(r=>r.stage===i).length);
  const list=base.filter(r=>U.pstage===null||r.stage===U.pstage).sort((a,b)=>b.last.localeCompare(a.last));
  return `<div class="ph" style="flex-wrap:wrap;margin-bottom:1rem"><p class="muted">${base.length} people${U.fac?' at '+esc(F(U.fac).short):' across all facilities'}. Change the facility at the top and the stages update.</p>
    <div class="seg"><button data-act="pmine" data-v="0" aria-pressed="${!U.pmine}">Everyone</button><button data-act="pmine" data-v="1" aria-pressed="${U.pmine}">My follow-ups</button></div></div>
  <div class="pipe">${STAGES.map((s,i)=>`<button class="stage" style="--c:${SCOL[i]}" data-act="pstage" data-i="${i}" aria-pressed="${U.pstage===i}"><span class="step">Stage ${i+1}</span><b>${counts[i]}</b><small>${s}</small></button>`).join('')}</div>
  <div class="panel"><div class="ph"><h3>${U.pstage===null?'Everyone':STAGES[U.pstage]}</h3>${U.pstage!==null?`<button class="btn sm ghost" data-act="pstage" data-i="-1">Show all stages</button>`:''}</div>
  <div class="tablewrap"><table><thead><tr><th>Name</th><th>Facility</th><th>Stage</th><th>Studying</th><th>Last seen</th><th>Follow-up</th></tr></thead><tbody>
  ${list.length?list.map(r=>`<tr class="click" data-act="person" data-id="${r.id}" tabindex="0"><td><b>${esc(r.name)}</b></td><td class="muted">${esc(F(r.fac).short)}</td><td><span class="pill"><i style="background:${SCOL[r.stage]}"></i>${STAGES[r.stage]}</span></td><td>${esc(r.topic)||'<span class="muted">–</span>'}</td><td class="muted">${fmt(r.last)}</td><td>${esc(V(r.follow).name)}</td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">No one at this stage${U.fac?' in '+esc(F(U.fac).short):''} yet.</div></td></tr>`}
  </tbody></table></div></div>`;
}
function personDrawer(id){const r=R(id);

    ...S.visits.filter(v=>v.seen.includes(id)).map(v=>({d:v.d,k:'visits',c:'#F0B94A',ty:'Visit',h:`<b>Seen by ${v.vols.map(x=>esc(V(x).name)).join(', ')}</b><small>${v.acts.join(', ')}</small>`})),
    ...S.visits.filter(v=>v.fac===r.fac&&!v.seen.includes(id)&&v.d>=(r.joined||'0')).map(v=>({d:v.d,k:'visits',c:'#5E6779',ty:'Missed visit',h:`<small>Not seen when the team visited</small>`})),
    ...S.needs.filter(n=>n.res===id).map(n=>({d:n.d,k:'needs',c:owing(n)?'#FF5C64':'#3DD68C',ty:'Need',h:`<b>${esc(n.item)}</b><small>${owing(n)?amt(n,owing(n))+' still owing · waiting '+ageOf(n.d)+' days':'Supplied'+(n.by?' by '+esc(n.by):'')}</small>`})),
    ...S.letters.filter(l=>l.res===id).map(l=>({d:l.d,k:'letters',c:'#5FC8E4',ty:'Letter',h:`<b>${l.writer?'From '+esc(l.writer):'Letter requested'}</b><small>${LST[l.stage]}</small>`})),
    ...S.letters.filter(l=>l.res===id).flatMap(l=>l.replies.map(p=>({d:p.d,k:'letters',c:'#3DD68C',ty:'Reply',h:`<b>Wrote back to ${esc(l.writer)}</b><small>${p.ok?esc(p.body):'Being reviewed'}</small>`}))),
    ...(r.hist||[]).map(h=>({d:h.d,k:'growth',c:SCOL[h.stage],ty:'Stage',h:`<b>${h.stage===0?'First contact':'Moved to '+STAGES[h.stage]}</b>`})),
    ...(r.events||[]).filter(e=>untilOf(e.d)<0).map(e=>({d:e.d,k:'events',c:ETYPES[e.type]||'#8D97A9',ty:e.type,h:`<small>${esc(e.note||'')}</small>`}))
  ].sort((a,b)=>b.d.localeCompare(a.d));
  const shown=ev.filter(e=>U.tlf==='all'||e.k===U.tlf);
  let lastM='';const items=shown.map(e=>{const m=new Date(e.d+'T12:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});const head=m!==lastM?`</ul><div class="month">${m}</div><ul class="tl">`:'';lastM=m;return head+`<li style="--c:${e.c}"><span class="ty">${esc(e.ty)}</span> <span class="muted" style="font-size:.8rem">· ${fmt(e.d)}</span>${e.h}</li>`}).join('');
  const up=(r.events||[]).filter(e=>untilOf(e.d)>=0).sort((a,b)=>a.d.localeCompare(b.d));
  const stageDate=i=>{const h=(r.hist||[]).find(x=>x.stage===i);return h?fmt(h.d):''};
  const filters=[['all','All'],['visits','Visits'],['notes','Notes'],['needs','Needs'],['letters','Letters'],['growth','Growth'],['events','Dates']];
  openDrawer(`<div style="display:flex;justify-content:space-between;align-items:start"><div><h3 style="font-size:1.45rem">${esc(r.name)}</h3><p class="muted">${esc(F(r.fac).name)} · known since ${r.joined?fmt(r.joined):'recently'}</p></div><button class="iconbtn" data-act="closeall" aria-label="Close">${icon('M18 6 6 18M6 6l12 12')}</button></div>
  <div class="prog">${STAGES.map((s,i)=>`<i class="${i<=r.stage?'on':''}" style="--c:${SCOL[r.stage]}" title="${s}${stageDate(i)?' · '+stageDate(i):''}"></i>`).join('')}</div>
  <div class="proglab"><span>First contact</span><b style="color:${SCOL[r.stage]}">${STAGES[r.stage]}${stageDate(r.stage)?' since '+stageDate(r.stage):''}</b><span>Baptized</span></div>
  <div class="row2" style="margin-top:1rem"><div><small class="muted">Last seen</small><p>${fmt(r.last)} · ${ageOf(r.last)} days ago</p></div><div><small class="muted">Follow-up</small><p>${esc(V(r.follow).name)}</p></div><div><small class="muted">Studying</small><p>${esc(r.topic)||'–'}</p></div><div><small class="muted">Stage</small><select class="input" style="padding:.4rem .6rem" data-act-change="dstage" data-id="${r.id}" aria-label="Change stage">${STAGES.map((s,i)=>`<option value="${i}" ${i===r.stage?'selected':''}>${s}</option>`).join('')}</select></div></div>

  <div class="actions" style="justify-content:flex-start;margin-top:1rem"><button class="btn sm" data-act="flag" data-id="${r.id}">${r.flag?'On next visit list ✓':'Add to next visit'}</button><button class="btn sm ghost" data-act="writeto" data-id="${r.id}">Write a letter</button></div>

  <ul class="tl">${items||'<li>Nothing of this kind yet.</li>'}</ul>`)}

/* ======= Letters ======= */
function letters(){
  const L=S.letters.filter(lFac);const counts=LST.map((_,i)=>L.filter(l=>l.stage===i).length);const tot=L.length||1;
  let a0=-Math.PI/2;const C=Math.PI*2;
  const segs=counts.map((n,i)=>{if(!n)return'';const a1=a0+n/tot*C;const p=`<path d="${arcPath(150,150,112,a0+.035,a1-.035)}" stroke="${LCOL[i]}" stroke-width="32" fill="none" data-act="lstage" data-i="${i}" class="${U.lstage===i?'sel':'dim'}"><title>${LST[i]}: ${n}</title></path>`;a0=a1;return p}).join('');
  const st=U.lstage;const sel=L.filter(l=>l.stage===st).sort((a,b)=>a.d.localeCompare(b.d));
  const R_=U.role,me=ME[R_].name;
  const who={0:'The coordinator assigns a writer',1:'The writer writes it',2:'The pastor or an elder reviews it',3:'Posted by mail, or carried in by a volunteer',4:'The review team logs the reply',5:'The pastor shares the reply with the writer'}[st];
  const card=l=>{const r=R(l.res);let a='',info='';
    if(l.returned)info+=`<div class="approval" style="border-left:3px solid var(--red)">Returned: ${esc(l.returned)}</div>`;
    if(st===0)a=R_==='coord'?`<button class="btn sm" data-act="lassign" data-id="${l.id}">Assign writer</button>`:`<p class="wait">Waiting for the coordinator to assign a writer</p>`;
    if(st===1)a=(R_==='coord'||(R_==='vol'&&l.writer===me))?`<button class="btn sm" data-act="lwrite" data-id="${l.id}">Write letter</button>`:`<p class="wait">Waiting for ${esc(l.writer)} to write it</p>`;
    if(st===2){info+=`<p class="body">${esc(l.body)}</p><div class="approval">With <b style="color:${T(l.reviewer).c}">${esc(T(l.reviewer).name)}</b> since ${fmt(l.d)}</div>`;a=R_==='review'?`<button class="btn sm" data-act="approve" data-id="${l.id}">Approve</button><button class="btn sm danger" data-act="return" data-id="${l.id}">Return to writer</button>`:`<p class="wait">Waiting for ${esc(T(l.reviewer).name)}</p>`}
    if(st===3){info+=`<div class="approval">Approved by <b>${esc(T(l.approval.by).name)}</b> on ${fmt(l.approval.d)} · <span class="muted">“${esc(l.approval.note)}”</span><br>Going in: <b style="color:var(--gold)">${l.carrier==='Mail'?'by mail (review team)':esc(l.carrier)}</b></div>`;
      const can=R_==='coord'||(R_==='review'&&l.carrier==='Mail')||(R_==='vol'&&l.carrier===me);a=can?`<button class="btn sm" data-act="lsent" data-id="${l.id}">${l.carrier==='Mail'?'Mark posted':'Mark handed in'}</button>`:`<p class="wait">Waiting for ${l.carrier==='Mail'?'the review team to post it':esc(l.carrier)+' to carry it in'}</p>`}
    if(st===4){info+=`<div class="approval">Sent ${fmt(l.sentD)} · ${l.carrier==='Mail'?'by mail':'carried in by '+esc(l.carrier)}</div>`;a=R_!=='vol'?`<button class="btn sm ghost" data-act="logreply" data-id="${l.id}">Log a reply</button>`:`<p class="wait">Waiting for a reply</p>`}
    if(st===5)l.replies.forEach((p,i)=>{info+=`<div class="approval" style="border-left:3px solid var(--green)"><b style="color:var(--green)">${esc(r.name)} wrote back</b> · ${fmt(p.d)}<br><span class="muted">${p.ok||R_==='review'?esc(p.body):'Being checked by the pastor before it is shared.'}</span></div>`;if(!p.ok&&R_==='review')a=`<button class="btn sm" data-act="replyok" data-id="${l.id}" data-i="${i}">Share with writer</button>`});
    return `<div class="lcard"><div class="top2"><div><b>${esc(r.name)}</b> <span class="muted">· ${esc(F(r.fac).short)}</span><div class="muted" style="font-size:.84rem">${esc(l.about||'')}${l.writer?' · writer: <b style="color:var(--text)">'+esc(l.writer)+'</b>':''}</div></div>${ageBadge(ageOf(l.d),st<3?3:7,st<3?6:14)}</div>${info}<div class="actions" style="justify-content:flex-start">${a}</div></div>`};
  return `<div class="lgrid">
  <div class="panel"><div class="ph"><h3>Letter journey</h3><small>Tap a stop</small></div>
    <div class="ring"><svg viewBox="0 0 300 300" role="img" aria-label="Letters by stage"><circle cx="150" cy="150" r="112" stroke="#1B2230" stroke-width="32" fill="none"/>${segs}</svg><div class="center"><b>${counts[st]}</b><small>${LST[st].toLowerCase()}</small></div></div>
    <div class="stagelist">${LST.map((s,i)=>`<button data-act="lstage" data-i="${i}" aria-pressed="${st===i}"><i style="background:${LCOL[i]}"></i><div>${i+1}. ${s}<br><small>${LHELP[i]}</small></div><span>${counts[i]}</span></button>`).join('')}</div>
  </div>
  <div class="panel"><div class="ph" style="flex-wrap:wrap"><h3 style="display:flex;align-items:center;gap:.5rem"><i style="width:10px;height:10px;border-radius:50%;background:${LCOL[st]};display:inline-block"></i>${st+1}. ${LST[st]}</h3>${st<5?`<button class="btn sm ghost" data-act="lstage" data-i="${st+1}">Next stop: ${LST[st+1]} →</button>`:''}</div>
    <p class="rolenote" style="margin:0 0 1rem">${who}.</p>
    ${sel.length?sel.map(card).join(''):'<div class="empty">Nothing at this stop.</div>'}
  </div></div>`;
}

    openModal('',`<div class="loop">${av(r.name,'#5FC8E4')}<h3>${esc(r.name.split(' ')[0])} will hear from ${esc(l.writer)}</h3><p>${esc(l.about)}. For someone with no visitors, this may be the only word from outside this month. It now clears for everyone.</p></div>`,'Close',closeAll)},
  logreply:d=>{openModal('Log a reply',`<div class="field"><label for="lr">Reply as received</label><textarea class="input" id="lr"></textarea></div>`,'Log reply',()=>{const t=document.getElementById('lr').value.trim();if(!t)return toast('Add the reply text.');const l=S.letters.find(x=>x.id===d.id);l.replies.push({d:today(),ok:false,body:t});l.stage=5;l.d=today();closeAll();render();toast('Reply logged for the pastor to check')})},
  replyok:d=>{S.letters.find(x=>x.id===d.id).replies[+d.i].ok=true;render();toast('Shared with the writer')},
  norder:d=>{const n=S.needs.find(x=>x.id===d.id);n.ordered=true;n.upd=today();render();toast(`${phys(n)?'Ordered':'In progress'} · ${V(n.from).name||'The volunteer'} sees it on their side`)},
  ndeliver:d=>{const n=S.needs.find(x=>x.id===d.id);n.supplied=n.asked;n.by=ME[U.role].name;n.upd=today();render();const r=R(n.res);const vn=V(n.from).name||'The volunteer';
    openModal('',`<div class="loop">${av(r.name,'#3DD68C')}<h3>${esc(r.name.split(' ')[0])} ${phys(n)?'will receive '+esc(({Blanket:'a blanket','Bible or books':'a Bible'})[n.item]||n.item.toLowerCase()):'is not forgotten'}</h3><p>${esc(vn)} sees this on their side, and can tell him at the next visit. A promise made inside, kept.</p>${r.notes[0]?`<p class="said" style="text-align:left;margin-top:1rem;font-family:var(--head)">Last thing he told us: “${esc(r.notes[0].t)}”</p>`:''}</div>`,'Close',closeAll)},
  resetdemo:()=>openModal('Reset the demo?','<p class="muted">All sample data goes back to how it started.</p>','Reset',()=>{seedN=11;S=buildSeed();closeAll();U.tab='home';render();toast('Demo data reset')}),
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='path'||A[el.dataset.act]){e.preventDefault();A[el.dataset.act]?.(el.dataset,el)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const g=document.getElementById('guide');if(g&&!g.classList.contains('hide'))return guideDone();closeAll()}if(e.key==='Enter'&&e.target.matches('tr.click'))A.person(e.target.dataset)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.bind&&U.draft)U.draft[t.dataset.bind]=t.value;if(t.dataset.row!==undefined&&t.dataset.f&&U.draft&&t.tagName!=='SELECT')U.draft.rows[+t.dataset.row][t.dataset.f]=t.value});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='scope'){U.fac=t.value;U.pstage=U.pstage;render();return}
  if(t.dataset.row!==undefined&&U.draft){const p=U.draft.rows[+t.dataset.row];
    if(t.dataset.need){const i=p.needs.indexOf(t.dataset.need);t.checked?(i<0&&p.needs.push(t.dataset.need)):(i>=0&&p.needs.splice(i,1));if(t.dataset.need.startsWith('financial|')||t.dataset.need==='supplies|Clothes')render();return}
    if(t.dataset.f==='who'){p.who=t.value;const r=S.res.find(x=>x.id===t.value);if(r){p.stage=r.stage;p.follow=r.follow}render();return}
    p[t.dataset.f]=t.dataset.f==='stage'?+t.value:t.value;return}
  if(t.dataset.actChk==='wact'){const a=U.draft.acts,i=a.indexOf(t.value);t.checked?(i<0&&a.push(t.value)):(i>=0&&a.splice(i,1));return}
  if(t.dataset.actChk==='printed'||t.dataset.actChk==='sent'){const l=S.letters.find(x=>x.id===t.dataset.id);l[t.dataset.actChk]=t.checked;if(l.printed&&l.sent){l.stage=3;toast('Printed and sent · moved on')}render();return}
  if(t.dataset.actChange==='assign'&&t.value){const l=S.letters.find(x=>x.id===t.dataset.id);l.reviewer=t.value;l.stage=1;l.returned=null;render();toast(`Assigned to ${T(t.value).name}`);return}
  if(t.dataset.actChange==='dstage'){const rr=R(t.dataset.id);(rr.hist=rr.hist||[]).push({d:today(),stage:+t.value});rr.stage=+t.value;personDrawer(t.dataset.id);render();toast('Stage updated');return}
});
</script>
</body>
